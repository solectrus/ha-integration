# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      # Home Assistant is bumped manually: a new release can raise the
      # required Python version (see .devcontainer.json and CI workflows).
      # The minimum version for users is declared separately in hacs.json.
      - dependency-name: 'homeassistant'
